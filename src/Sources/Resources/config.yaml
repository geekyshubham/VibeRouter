# Server port (CLIProxyAPI runs on 8318, ThinkingProxy forwards from 8317)
port: 8318

# Bind to localhost only for security (prevents exposure on public IPs)
host: 127.0.0.1

# Amp CLI integration (management requests only - login, user, threads)
amp-upstream-url: "https://ampcode.com"
amp-restrict-management-to-localhost: true

# Management API settings (required for /management.html)
# Empty secret-key disables the Management API entirely (404 on /v0/management/*).
# Plaintext is bcrypt-hashed by CLIProxyAPI on first load.
remote-management:
  allow-remote: false
  secret-key: "viberouter-admin"

# Authentication directory (stores OAuth tokens)
auth-dir: "~/.cli-proxy-api"

# Logging configuration
debug: false
logging-to-file: false

# Usage statistics
usage-statistics-enabled: true

# Network proxy (if needed for corporate networks)
proxy-url: ""

# Retry configuration
request-retry: 3

# Timeout for upstream provider requests
# Default: 10m. Set to "0" to disable timeout.
# Important for Extended Thinking requests which may take 5-10+ minutes.
request-timeout: "10m"

# Quota management
# switch-project / switch-preview-model: try another project/model on 429.
# antigravity-credits: when all free-tier Antigravity auths are exhausted, retry
# Claude models with an auth that still has Google One AI credits (last resort).
quota-exceeded:
  switch-project: true
  switch-preview-model: true
  antigravity-credits: true

# Credential selection when several accounts match a request.
# round-robin (default) spreads load; fill-first uses the first healthy account
# until it is exhausted, then moves to the next — easier to reason about with
# 10 Antigravity logins. Automatic failover to the next healthy auth on
# 429/quota errors is always enabled regardless of strategy.
routing:
  strategy: "fill-first"

# OAuth providers for local subscriptions
# Claude, Codex (GPT), Gemini tokens in ~/.cli-proxy-api/ will be used
# No fallback - users must authenticate providers they want to use

# No API keys needed for OAuth-based providers
generative-language-api-key: []

# OpenAI-compatible providers (import API keys from configured local apps)
openai-compatibility:
  - name: opencode-go
    display-name: OpenCode Go
    base-url: https://opencode.ai/zen/go/v1
    help-text: OpenCode Go subscription models via OpenCode Zen.
    icon-system: terminal.fill
    # OpenCode Go returns 400 MissingSessionID unless this header is present.
    headers:
      User-Agent: viberouter/1.0
      x-opencode-session: viberouter
    models:
      - alias: glm-5.3-flash
        name: glm-5.3-flash
      - alias: glm-5.2
        name: glm-5.2
      - alias: glm-5.1
        name: glm-5.1
      - alias: kimi-k2.7-code
        name: kimi-k2.7-code
      - alias: kimi-k2.6
        name: kimi-k2.6
      - alias: deepseek-v4-pro
        name: deepseek-v4-pro
      - alias: deepseek-v4-flash
        name: deepseek-v4-flash
      - alias: qwen3.7-max
        name: qwen3.7-max
      - alias: qwen3.7-plus
        name: qwen3.7-plus

# ChatGPT Codex accounts reject gpt-5.4-mini, which is the image-tool host.
# gpt-5.5 is a model this login can call, and it still drives gpt-image-2.
gpt-image-2-base-model: gpt-5.5

# Kimi K2.7 Code rejects every temperature except 1.
payload:
  override:
    - models:
        - name: kimi-k2.7-code
          protocol: openai
      params:
        temperature: 1
