name: Build and Release (Code Signed)

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write

jobs:
  build-signed:
    name: Build and Sign macOS App (${{ matrix.arch }})
    runs-on: macos-26  # macOS Tahoe — required for the Liquid Glass (macOS 26) SDK
    strategy:
      matrix:
        include:
          - arch: arm64
            swift_arch: arm64
            tested: true
          - arch: x86_64
            swift_arch: x86_64
            tested: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26 (Liquid Glass SDK / Swift 6.2+)
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set up Go (build the custom cli-proxy-api-plus from the vendored fork)
        uses: actions/setup-go@v5
        with:
          go-version-file: third_party/CLIProxyAPI/go.mod

      - name: Set up Node (build the management UI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import Code Signing Certificates
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION} (build ${BUILD_NUMBER}) for ${{ matrix.arch }}"

      - name: Build cli-proxy-api-plus (custom UI embedded) for ${{ matrix.arch }}
        run: |
          set -e
          # Build the custom binary from the vendored CLIProxyAPI fork with our
          # management-ui embedded, instead of downloading the STOCK upstream
          # binary (which ships the upstream panel, not ours). The script builds
          # the UI, embeds it, cross-compiles for the target arch, and FAILS if
          # the resulting binary lacks the custom UI marker.
          chmod +x scripts/build-cliproxy-plus.sh
          ./scripts/build-cliproxy-plus.sh "${{ matrix.arch }}" src/Sources/Resources/cli-proxy-api-plus
          file src/Sources/Resources/cli-proxy-api-plus
          ls -lh src/Sources/Resources/cli-proxy-api-plus

      - name: Build app bundle for ${{ matrix.arch }}
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
          TARGET_ARCH: ${{ matrix.swift_arch }}
        run: |
          chmod +x create-app-bundle.sh
          ./create-app-bundle.sh

      - name: Guard — bundled binary must carry our custom management UI
        run: |
          set -e
          # Bundle name matches APP_NAME in create-app-bundle.sh and contains a
          # SPACE, so every path referencing it must stay quoted.
          BIN="VibeRouter.app/Contents/Resources/cli-proxy-api-plus"
          if ! grep -a -q 'VibeRouter' "$BIN"; then
            echo "::error:: bundled cli-proxy-api-plus is MISSING the custom management UI (stock upstream detected) — refusing to ship" >&2
            exit 1
          fi
          echo "✅ bundled binary carries the custom management UI"

      - name: Verify Code Signature
        run: |
          codesign --verify --deep --strict --verbose=2 "VibeRouter.app"
          codesign -dv --verbose=4 "VibeRouter.app"
          spctl -a -vvv -t install "VibeRouter.app" || echo "⚠️ Gatekeeper check failed (expected without notarization)"

      - name: Notarize App
        run: |
          ditto -c -k --sequesterRsrc --keepParent "VibeRouter.app" "VibeRouter-notarize.zip"
          
          echo "Submitting app for notarization..."
          SUBMIT_OUTPUT=$(xcrun notarytool submit "VibeRouter-notarize.zip" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --wait --output-format json)
          
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | jq -r '.id')
          STATUS=$(echo "$SUBMIT_OUTPUT" | jq -r '.status')
          
          if [ "$STATUS" != "Accepted" ]; then
            echo "❌ Notarization failed with status: $STATUS"
            echo "📋 Getting detailed log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
            exit 1
          fi
          
          echo "✅ Notarization succeeded! Stapling ticket..."
          xcrun stapler staple "VibeRouter.app"
          xcrun stapler validate "VibeRouter.app"
          echo "✅ App successfully notarized and stapled!"
          
          rm "VibeRouter-notarize.zip"

      - name: Create DMG
        run: |
          brew install create-dmg

          create-dmg \
            --volname "VibeRouter" \
            --volicon "icon.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "VibeRouter.app" 175 120 \
            --hide-extension "VibeRouter.app" \
            --app-drop-link 425 120 \
            --codesign "${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}" \
            "VibeRouter-${{ matrix.arch }}.dmg" \
            "VibeRouter.app" || true

          if [ -f "VibeRouter-${{ matrix.arch }}.dmg" ]; then
            echo "✅ DMG created successfully"
            codesign -dv "VibeRouter-${{ matrix.arch }}.dmg" || echo "⚠️ DMG not signed (non-fatal)"
          fi

      - name: Create ZIP archive
        run: |
          # Archive keeps a space-free name so its download URL needs no %20 escaping.
          ditto -c -k --sequesterRsrc --keepParent "VibeRouter.app" "VibeRouter-${{ matrix.arch }}.zip"

      - name: Calculate checksums
        run: |
          shasum -a 256 VibeRouter-${{ matrix.arch }}.zip > VibeRouter-${{ matrix.arch }}.zip.sha256
          if [ -f "VibeRouter-${{ matrix.arch }}.dmg" ]; then
            shasum -a 256 VibeRouter-${{ matrix.arch }}.dmg > VibeRouter-${{ matrix.arch }}.dmg.sha256
          fi

      - name: Sign update for Sparkle
        id: sparkle_sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGN_UPDATE=$(find src/.build -name "sign_update" -type f | grep -v old_dsa | head -1)
          
          if [ -z "$SIGN_UPDATE" ]; then
            echo "Error: sign_update not found"
            find src/.build -name "sign_update" -type f
            exit 1
          fi
          
          echo "Using sign_update: $SIGN_UPDATE"
          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" VibeRouter-${{ matrix.arch }}.zip --ed-key-file -)
          
          ED_SIGNATURE=$(echo "$SIGNATURE" | grep -o 'sparkle:edSignature="[^"]*"' | sed 's/sparkle:edSignature="//;s/"$//')
          LENGTH=$(stat -f%z VibeRouter-${{ matrix.arch }}.zip)
          
          echo "ed_signature=$ED_SIGNATURE" >> $GITHUB_OUTPUT
          echo "length=$LENGTH" >> $GITHUB_OUTPUT
          echo "Sparkle signature generated for ${{ matrix.arch }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: viberouter-${{ matrix.arch }}
          path: |
            VibeRouter-${{ matrix.arch }}.zip
            VibeRouter-${{ matrix.arch }}.zip.sha256
            VibeRouter-${{ matrix.arch }}.dmg
            VibeRouter-${{ matrix.arch }}.dmg.sha256
          retention-days: 1

      - name: Save Sparkle signature
        run: |
          echo "${{ steps.sparkle_sign.outputs.ed_signature }}" > sparkle_signature_${{ matrix.arch }}.txt
          echo "${{ steps.sparkle_sign.outputs.length }}" > sparkle_length_${{ matrix.arch }}.txt
      
      - name: Upload Sparkle signature
        uses: actions/upload-artifact@v4
        with:
          name: sparkle-signature-${{ matrix.arch }}
          path: |
            sparkle_signature_${{ matrix.arch }}.txt
            sparkle_length_${{ matrix.arch }}.txt
          retention-days: 1

  release:
    name: Create Release
    needs: [build-signed]
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/viberouter-arm64/* release/
          cp artifacts/viberouter-x86_64/* release/
          ls -la release/

      - name: Download Sparkle signatures
        uses: actions/download-artifact@v4
        with:
          pattern: sparkle-signature-*
          path: sparkle
          merge-multiple: true

      - name: Update appcast files
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          BUILD_NUMBER=$(git rev-list --count HEAD)
          TODAY=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          
          # Read signatures for both architectures
          ARM64_SIGNATURE=$(cat sparkle/sparkle_signature_arm64.txt)
          ARM64_LENGTH=$(cat sparkle/sparkle_length_arm64.txt)
          X86_64_SIGNATURE=$(cat sparkle/sparkle_signature_x86_64.txt)
          X86_64_LENGTH=$(cat sparkle/sparkle_length_x86_64.txt)
          
          # Update arm64 appcast (appcast.xml - default)
          cat > /tmp/new_item_arm64.xml << ENDOFITEM
              <item>
                <title>Version ${VERSION}</title>
                <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <pubDate>${TODAY}</pubDate>
                <enclosure url="https://github.com/Geekyshubham/VibeRouter/releases/download/v${VERSION}/VibeRouter-arm64.zip"
                           type="application/octet-stream"
                           sparkle:edSignature="${ARM64_SIGNATURE}"
                           length="${ARM64_LENGTH}"/>
              </item>
          ENDOFITEM
          
          sed -i.bak '/<language>en<\/language>/r /tmp/new_item_arm64.xml' appcast.xml
          rm -f appcast.xml.bak /tmp/new_item_arm64.xml
          
          echo "Updated appcast.xml (arm64) with version ${VERSION}"
          
          # Create/update x86_64 appcast (appcast-x86_64.xml)
          if [ ! -f appcast-x86_64.xml ]; then
            # Create new x86_64 appcast from template
            cat > appcast-x86_64.xml << 'ENDOFAPPCAST'
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>VibeRouter Updates (Intel)</title>
              <link>https://github.com/Geekyshubham/VibeRouter/releases</link>
              <description>Most recent updates to VibeRouter for Intel Macs</description>
              <language>en</language>
            </channel>
          </rss>
          ENDOFAPPCAST
          fi
          
          # Add new item to x86_64 appcast
          cat > /tmp/new_item_x86_64.xml << ENDOFITEM
              <item>
                <title>Version ${VERSION}</title>
                <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <pubDate>${TODAY}</pubDate>
                <enclosure url="https://github.com/Geekyshubham/VibeRouter/releases/download/v${VERSION}/VibeRouter-x86_64.zip"
                           type="application/octet-stream"
                           sparkle:edSignature="${X86_64_SIGNATURE}"
                           length="${X86_64_LENGTH}"/>
              </item>
          ENDOFITEM
          
          sed -i.bak '/<language>en<\/language>/r /tmp/new_item_x86_64.xml' appcast-x86_64.xml
          rm -f appcast-x86_64.xml.bak /tmp/new_item_x86_64.xml
          
          echo "Updated appcast-x86_64.xml with version ${VERSION}"
          head -30 appcast.xml
          echo "---"
          head -30 appcast-x86_64.xml

      - name: Commit appcast files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull origin main
          git add appcast.xml appcast-x86_64.xml
          git commit -m "Update appcast files for v${{ steps.get_version.outputs.VERSION }}" || echo "No changes to commit"
          git push origin main

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/VibeRouter-arm64.zip
            release/VibeRouter-arm64.zip.sha256
            release/VibeRouter-arm64.dmg
            release/VibeRouter-arm64.dmg.sha256
            release/VibeRouter-x86_64.zip
            release/VibeRouter-x86_64.zip.sha256
            release/VibeRouter-x86_64.dmg
            release/VibeRouter-x86_64.dmg.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## VibeRouter ${{ steps.get_version.outputs.VERSION }}

            ### Downloads

            | Architecture | DMG | ZIP |
            |--------------|-----|-----|
            | **Apple Silicon** (M1/M2/M3/M4) | `VibeRouter-arm64.dmg` | `VibeRouter-arm64.zip` |
            | **Intel** (x86_64) | `VibeRouter-x86_64.dmg` | `VibeRouter-x86_64.zip` |

            ### Installation

            1. Download the appropriate file for your Mac
            2. For DMG: Mount and drag to Applications
            3. For ZIP: Extract and drag to Applications
            4. Double-click to launch (Right-click → Open if Gatekeeper blocks)

            ### What's New

            See the [CHANGELOG](https://github.com/Geekyshubham/VibeRouter/blob/main/CHANGELOG.md) for details.

            ### Verification

            This release is **code signed** with Apple Developer ID and includes SHA-256 checksums.

            ```bash
            shasum -a 256 -c VibeRouter-arm64.zip.sha256
            ```

            ---

            ✅ **Code Signed & Notarized** - No Gatekeeper warnings!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
